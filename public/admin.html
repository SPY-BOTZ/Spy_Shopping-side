<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - SPY BOTZ</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-4">
<div id="loginBox" class="max-w-sm mx-auto bg-white p-6 rounded-xl shadow mt-20"><h2 class="text-xl font-bold mb-4">Admin Login</h2><input id="user" placeholder="admin" class="w-full border p-2 rounded mb-2"><input id="pass" type="password" placeholder="spybotz123" class="w-full border p-2 rounded mb-2"><button onclick="login()" class="w-full bg-black text-white py-2 rounded">Login</button><p id="loginMsg" class="text-sm mt-2 text-center text-red-500"></p></div>
<div id="adminBox" class="hidden max-w-7xl mx-auto"><h1 class="text-2xl font-bold mb-4">SPY BOTZ - ULTRA Admin</h1>
<div class="grid md:grid-cols-2 gap-6">
<div class="bg-white p-4 rounded-xl shadow"><h3 class="font-bold mb-2">Add New Product + Variants</h3><input id="name" placeholder="Dress Name" class="w-full border p-2 rounded mb-2"><input id="price" type="number" placeholder="Selling Price" class="w-full border p-2 rounded mb-2"><input id="originalPrice" type="number" placeholder="Original Price" class="w-full border p-2 rounded mb-2"><input id="size" placeholder="Size M,L,XL" class="w-full border p-2 rounded mb-2"><input id="image" placeholder="Main Image URL" class="w-full border p-2 rounded mb-2"><input id="details" placeholder="Details" class="w-full border p-2 rounded mb-2"><input id="rating" placeholder="Rating 4.8" class="w-full border p-2 rounded mb-2">
<div class="bg-yellow-50 p-2 rounded border mb-2"><p class="text-xs font-bold mb-1">Add Variants (Size wise photo & price)</p><div id="variantBox" class="space-y-1"></div><button type="button" onclick="addVariantInput()" class="text-xs bg-black text-white px-2 py-1 rounded mt-1">+ Add Size/Photo</button></div>
<button onclick="addDress()" class="w-full bg-pink-600 text-white py-2 rounded">Add Product</button><p id="addMsg" class="text-sm mt-2"></p><div id="dressList" class="mt-4 grid grid-cols-2 gap-2"></div></div>
<div class="bg-white p-4 rounded-xl shadow"><h3 class="font-bold mb-2 flex justify-between">All Orders <button onclick="loadOrders()" class="bg-black text-white px-3 py-1 rounded text-xs">Load Orders</button></h3><div id="orderList" class="space-y-4 max-h-[90vh] overflow-y-auto"></div></div>
</div></div>
<script>
let dresses=[],variantList=[];
function login(){fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})}).then(r=>r.json()).then(d=>{if(d.success){document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminBox').classList.remove('hidden');loadDresses();loadOrders();}else document.getElementById('loginMsg').innerText=d.message})}
function addVariantInput(){let id=Date.now();let html=`<div id="v-${id}" class="flex gap-1"><input id="vs-${id}" placeholder="Size S" class="w-1/4 border p-1 rounded text-xs"><input id="vp-${id}" type="number" placeholder="Price" class="w-1/4 border p-1 rounded text-xs"><input id="vi-${id}" placeholder="Image URL" class="flex-1 border p-1 rounded text-xs"><button onclick="document.getElementById('v-${id}').remove()" class="text-xs bg-red-500 text-white px-1 rounded">X</button></div>`;document.getElementById('variantBox').insertAdjacentHTML('beforeend',html)}
function collectVariants(){let vars=[];document.querySelectorAll('[id^="v-"]').forEach(div=>{let id=div.id.split('-')[1];let size=document.getElementById('vs-'+id)?.value;let price=document.getElementById('vp-'+id)?.value;let image=document.getElementById('vi-'+id)?.value;if(size&&price&&image)vars.push({size,price:Number(price),image})});return vars;}
function loadDresses(){fetch('/api/dresses').then(r=>r.json()).then(data=>{dresses=data;document.getElementById('dressList').innerHTML=data.map(d=>`<div class="border p-2 rounded"><img src="${d.image}" class="h-20 w-full object-cover rounded"><p class="text-xs font-bold">${d.name} - ₹${d.price}</p><p class="text-[10px]">${d.variants?d.variants.length:0} variants</p><button onclick="deleteDress(${d.id})" class="text-[10px] bg-red-500 text-white px-2 py-1 rounded mt-1">Delete</button></div>`).join('')})}
function addDress(){let payload={name:document.getElementById('name').value,price:document.getElementById('price').value,originalPrice:document.getElementById('originalPrice').value,size:document.getElementById('size').value,image:document.getElementById('image').value,details:document.getElementById('details').value,rating:document.getElementById('rating').value,variants:collectVariants()};fetch('/api/dresses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json()).then(d=>{document.getElementById('addMsg').innerText=d.message;loadDresses()})}
function deleteDress(id){fetch('/api/dresses/'+id,{method:'DELETE'}).then(()=>loadDresses())}
function loadOrders(){fetch('/api/admin/orders').then(r=>r.json()).then(data=>{let box=document.getElementById('orderList');if(!data.length){box.innerHTML='No orders';return}box.innerHTML=data.map(o=>`<div class="border-2 p-3 rounded-lg bg-gray-50"><div class="flex gap-3"><img src="${o.selectedImage||'https://via.placeholder.com/100'}" class="w-20 h-20 rounded object-cover border"><div class="flex-1"><p class="font-bold text-sm">Order #${o.id}</p><p class="text-xs font-bold text-pink-600">${o.dressName} | Size: ${o.selectedSize||''} | ₹${o.finalPrice||o.price}</p><p class="text-[11px]">Customer: ${o.customerName||o.name} | ${o.phone}</p><p class="text-[11px]">Address: ${o.address}</p>${o.location?`<a href="${o.location}" target="_blank" class="text-[11px] text-blue-600 underline">📍 Customer Live Location</a>`:''}<p class="text-[11px]">Pay: ${o.paymentMethod} | ${o.date}</p></div></div><div class="mt-3 bg-white p-2 rounded border"><p class="text-xs font-bold">Update Tracking (Member dekhbe):</p><select id="status-${o.id}" class="w-full border p-1 rounded text-xs mt-1"><option ${o.status=='Order Placed'?'selected':''}>Order Placed</option><option ${o.status=='Packed'?'selected':''}>Packed</option><option ${o.status=='Shipped'?'selected':''}>Shipped</option><option ${o.status=='Out for Delivery'?'selected':''}>Out for Delivery</option><option ${o.status=='Delivered'?'selected':''}>Delivered</option></select><input id="cloc-${o.id}" value="${o.currentLocation||''}" placeholder="Current Location ex: Malda Hub" class="w-full border p-1 rounded text-xs mt-1"><div class="flex gap-1 mt-1"><input id="date-${o.id}" value="${o.deliveryDate||''}" type="date" class="flex-1 border p-1 rounded text-xs"><input id="time-${o.id}" value="${o.deliveryTime||''}" type="time" class="flex-1 border p-1 rounded text-xs"></div><button onclick="updateTrack(${o.id})" class="w-full bg-green-600 text-white py-1.5 rounded text-xs mt-2 font-bold">Update Tracking</button><p id="msg-${o.id}" class="text-[11px] text-green-600 mt-1"></p></div></div>`).join('')})}
function updateTrack(id){let payload={status:document.getElementById('status-'+id).value,currentLocation:document.getElementById('cloc-'+id).value,deliveryDate:document.getElementById('date-'+id).value,deliveryTime:document.getElementById('time-'+id).value};fetch('/api/orders/'+id+'/tracking',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json()).then(d=>{document.getElementById('msg-'+id).innerText=d.message})}
</script></body></html>
