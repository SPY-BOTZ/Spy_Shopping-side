<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPY BOTZ - Dresses Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-white shadow-md p-4 flex justify-between items-center max-w-6xl mx-auto rounded-b-lg">
        <h1 class="text-2xl font-bold text-pink-600">SPY BOTZ Shop</h1>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <h2 class="text-xl font-semibold mb-4">Available Dresses</h2>
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>

        <!-- Order Form -->
        <div class="mt-10 bg-white p-6 rounded-lg shadow-md max-w-xl mx-auto">
            <h3 class="text-xl font-bold mb-4 text-pink-600">Checkout & Place Order</h3>
            <form id="order-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Select Dress ID</label>
                    <input type="number" id="dressId" required class="w-full border p-2 rounded mt-1" placeholder="Enter Dress ID">
                </div>
                <div>
                    <label class="block text-sm font-medium">Your Name</label>
                    <input type="text" id="name" required class="w-full border p-2 rounded mt-1" placeholder="Your name">
                </div>
                <div>
                    <label class="block text-sm font-medium">Phone Number</label>
                    <input type="text" id="phone" required class="w-full border p-2 rounded mt-1" placeholder="Phone number">
                </div>
                <div>
                    <label class="block text-sm font-medium">Delivery Address</label>
                    <textarea id="address" required class="w-full border p-2 rounded mt-1" placeholder="Address"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium">Payment Method</label>
                    <select id="paymentMethod" class="w-full border p-2 rounded mt-1">
                        <option value="Online Payment (UPI/Card)">Online Payment (UPI / Card)</option>
                        <option value="Cash on Delivery">Cash on Delivery (COD)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-pink-600 text-white font-bold py-2 rounded hover:bg-pink-700">Buy Now</button>
            </form>
            <p id="response-msg" class="mt-4 font-medium text-center text-green-600"></p>
        </div>
    </main>

    <script>
        fetch('/api/dresses')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('product-grid');
                grid.innerHTML = data.map(item => `
                    <div class="bg-white rounded-lg shadow overflow-hidden p-4 flex flex-col justify-between">
                        <div>
                            <img src="${item.image}" alt="${item.name}" class="w-full h-48 object-cover rounded">
                            <h3 class="font-bold mt-2 text-lg">ID: ${item.id} - ${item.name}</h3>
                            <p class="text-pink-600 font-bold text-xl mt-1">₹${item.price}</p>
                            <p class="text-gray-500 text-sm">Size: ${item.size}</p>
                        </div>
                        <button onclick="document.getElementById('dressId').value=${item.id}; window.scrollTo({top: 800, behavior: 'smooth'});" class="mt-4 bg-gray-900 text-white py-1.5 rounded hover:bg-pink-600 transition">Select to Buy</button>
                    </div>
                `).join('');
            });

        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                dressId: document.getElementById('dressId').value,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                paymentMethod: document.getElementById('paymentMethod').value
            };

            const res = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            document.getElementById('response-msg').innerText = data.message;
            if(data.success) document.getElementById('order-form').reset();
        });
    </script>
</body>
</html>
