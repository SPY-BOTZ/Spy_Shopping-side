<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Track Order - SPY BOTZ</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 p-4"><div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow mt-6"><a href="/" class="text-sm text-blue-600 underline">← Back to Shop</a><h2 class="text-xl font-bold mt-2">Track Your Order - Separate Page</h2><p class="text-xs text-gray-500 mb-3">Phone number diye search koro</p><div class="flex gap-2"><input id="phone" placeholder="Enter Phone Number" class="flex-1 border p-2 rounded"><button onclick="track()" class="bg-black text-white px-5 rounded">Track</button></div><div id="result" class="mt-5"></div></div>
<script>async function track(){let phone=document.getElementById('phone').value;if(!phone)return alert('Phone number dao');let res=await fetch('/api/orders?phone='+phone);let data=await res.json();let div=document.getElementById('result');if(!data.length){div.innerHTML='<p class=text-red-500>No order found</p>';return}div.innerHTML=data.map(o=>`<div class="border p-4 rounded-lg bg-gray-50 mb-3"><div class="flex gap-3"><img src="${o.selectedImage||''}" class="w-16 h-16 rounded object-cover"><div><p class="font-bold text-sm">Order #${o.id} - ${o.dressName}</p><p class="text-xs">Size: ${o.selectedSize||''}</p><p class="text-sm">Status: <b class="text-pink-600">${o.status}</b></p></div></div><div class="w-full bg-gray-200 h-2 rounded-full my-2"><div class="bg-pink-600 h-2 rounded-full" style="width:${o.status=='Delivered'?'100%':o.status=='Out for Delivery'?'80%':o.status=='Shipped'?'60%':o.status=='Packed'?'40%':'20%'}"></div></div><p class="text-sm">📍 ${o.currentLocation}</p><p class="text-sm">📅 ${o.deliveryDate} ⏰ ${o.deliveryTime}</p></div>`).join('')}</script></body></html>
